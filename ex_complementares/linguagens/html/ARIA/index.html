<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste ARIA</title>
</head>
<body>
    <button id="botaoMenu" aria-expanded="false">
        Menu
    </button>

    <nav id="menu" hidden>
        <a href="#">início</a>
        <a href="#">projetos</a>
        <a href="#">contato</a>
    </nav>
</body>
<script src="script.js"></script>
</html>

<!--
o HIDDEN serve para deixar o menu escondindo no início; ele trabalha junto com o ARIA e o JS.
-->
